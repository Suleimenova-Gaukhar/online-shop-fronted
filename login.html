<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login — MagazinOnline</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <div id="navbar"></div>

    <div class="form-wrapper">
        <h2 class="form-title">Log In</h2>

        <div id="message" class="message" style="display:none;"></div>

        <div class="form-group">
            <label for="email">Email</label>
            <input type="email" id="email" placeholder="Enter your email">
        </div>

        <div class="form-group">
            <label for="password">Password</label>
            <input type="password" id="password" placeholder="Enter your password">
        </div>

        <button class="btn btn-primary" style="width:100%;" onclick="handleLogin()">
            Log In
        </button>

        <p class="form-link">
            Don't have an account? <a href="register.html">Sign Up</a>
        </p>
    </div>

    <footer>
        <span>MagazinOnline</span>
        <div>
            <a href="index.html">Home</a>
            <a href="shop.html">Shop</a>
        </div>
    </footer>

    <script src="js/auth.js"></script>
    <script src="js/navbar.js"></script>
    <script src="js/api.js"></script>

    <!--Script for handling all user types, redirects to the appropriate pages (returned by the backend)-->
    <script>
        if (isLoggedIn()) {
            window.location.href = 'index.html';
        }

        async function handleLogin() {
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value.trim();

            if (!email || !password) {
                showMessage('Please fill in all fields.', 'error');
                return;
            }

            try {
                const response = await login(email, password);

                if (response.includes('Login successful')) {
                    const role = response.split('Role: ')[1];
                    const name = localStorage.getItem('pendingName') || email;
                    localStorage.removeItem('pendingName');

                    saveUser(email, role, name);

                    if (role === 'ADMIN') {
                        window.location.href = 'admin-dashboard.html';
                    } else if (role === 'SELLER') {
                        window.location.href = 'seller-dashboard.html';
                    } else {
                        window.location.href = 'shop.html';
                    }

                } else if (response.includes('not approved')) {
                    showMessage('Your account is pending admin approval.', 'warning');
                } else if (response.includes('deactivated')) {
                    showMessage('Your account has been deactivated.', 'error');
                } else if (response.includes('not found')) {
                    showMessage('No account found with this email.', 'error');
                } else if (response.includes('Wrong password')) {
                    showMessage('Incorrect password.', 'error');
                } else {
                    showMessage('Something went wrong. Please try again.', 'error');
                }

            } catch (error) {
                showMessage('Cannot connect to server. Make sure the backend is running.', 'error');
            }
        }
        
        function showMessage(text, type) {
            const box = document.getElementById('message');
            box.textContent = text;
            box.className = `message message-${type}`;
            box.style.display = 'block';
        }

        document.addEventListener('keydown', function(e) {
            if (e.key === 'Enter') handleLogin();
        });
    </script>

</body>
</html>
