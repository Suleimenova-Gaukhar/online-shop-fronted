<!--Page made by Daria Mazareanu-->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MagazinOnline</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <!-- Navbar loading from navbar.js -->
    <div id="navbar"></div>

    <!-- Hero section -->
    <section class="hero">
        <h1>Welcome to MagazinOnline!</h1>
        <p>Start Shopping now!</p>
        <div class="hero-search">
            <input type="text" id="searchInput" placeholder="Search products...">
            <button onclick="goToShopWithSearch()">Shop</button>
        </div>
    </section>

    <!-- Decorative category cards -->
    <div class="page-wrapper">
        <h2 class="section-title" style="text-align:center; margin-bottom: 32px;">
            Our Products
        </h2>
        <div class="category-grid">

            <div class="category-card">
                <div class="category-img">
                    <img src="images/electronics.svg" alt="Electronics">
                </div>
                <p>Electronics</p>
            </div>

            <div class="category-card">
                <div class="category-img">
                    <img src="images/furniture.svg" alt="Home & Furniture">
                </div>
                <p>Home & Furniture</p>
            </div>

            <div class="category-card">
                <div class="category-img">
                    <img src="images/sport.svg" alt="Hobby & Sport">
                </div>
                <p>Hobby & Sport</p>
            </div>

        </div>

        <!-- Seller banner for fast registration -->
        <div class="cta-banner">
            <h2>New entrepreneur?</h2>
            <p>Start Selling now!</p>
            <a href="register.html?role=seller" class="btn btn-primary">Register as Seller</a>
        </div>

    </div>

    <!-- Footer -->
    <footer>
        <span>MagazinOnline</span>
        <div>
            <a href="index.html">Home</a>
            <a href="shop.html">Shop</a>
        </div>
    </footer>

    <!-- All the necessary js scripts (first authentification, then navbar loading) -->
    <script src="js/auth.js"></script>
    <script src="js/navbar.js"></script>

    <!--Short script for the search bar functionality, that redirects to the shop page with the items searched (Added by Gaukhar Suleimenova)-->>
    <script>
        function goToShopWithSearch() {
            const query = document.getElementById('searchInput').value.trim();
            if (query) {
                window.location.href = `shop.html?search=${encodeURIComponent(query)}`;
            } else {
                window.location.href = 'shop.html';
            }
        }
    </script>

</body>
</html>
