<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shop — MagazinOnline</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <!-- Loading the navbar from folder js/navbar.js -->
    <div id="navbar"></div>

    <div class="page-wrapper">

        <h1 class="page-title">Shop</h1>

        <!-- Search bar -->
        <div class="shop-search">
            <input 
                type="text" 
                id="searchInput" 
                placeholder="Search products by name or description..."
                oninput="filterProducts()"
            >
        </div>

        <!--Communication with the user: -->

        <div id="message" class="message" style="display:none;"></div>

        <div class="product-grid" id="productGrid"></div>

        <div class="empty-state" id="emptyState" style="display:none;">
            <p>No products found.</p>
            <p>Try a different search or check back later!</p>
        </div>

    </div>

    <!-- footer or lower navbar -->
    <footer>
        <span>MagazinOnline</span>
        <div>
            <a href="index.html">Home</a>
            <a href="shop.html">Shop</a>
        </div>
    </footer>

    <script src="js/auth.js"></script>
    <script src="js/navbar.js"></script>
    <script src="js/api.js"></script>
    <!--Getting everything together for the shop page/communication with the backend!-->
    <script>
        let allProducts = [];

        document.addEventListener('DOMContentLoaded', async function() {
            await loadProducts();

            // Check if coming from homepage with a search query
            const params = new URLSearchParams(window.location.search);
            const query = params.get('search');
            if (query) {
                document.getElementById('searchInput').value = query;
                filterProducts();
            }
        });

        async function loadProducts() {
            try {
                allProducts = await getAllProducts();
                renderProducts(allProducts);
            } catch (error) {
                showMessage('Cannot connect to server. Make sure the backend is running.', 'error');
            }
        }

        function renderProducts(products) {
            const grid = document.getElementById('productGrid');
            const emptyState = document.getElementById('emptyState');

            if (products.length === 0) {
                grid.innerHTML = '';
                emptyState.style.display = 'block';
                return;
            }

            emptyState.style.display = 'none';

            const isSeller = isLoggedIn() && isRole('SELLER');

            grid.innerHTML = products.map(product => `
                <div class="card" onclick="${isSeller ? '' : `goToProduct(${product.id})`}" 
                    style="cursor:${isSeller ? 'default' : 'pointer'};">
                    <div class="card-body">
                        <span class="badge ${product.negotiable ? 
                            'badge-negotiable' : 'badge-fixed'}">
                            ${product.negotiable ? 'Negotiable' : 'Fixed Price'}
                        </span>
                        <div class="card-title">${product.name}</div>
                        <div class="card-price">€${product.price.toFixed(2)}</div>
                        <div class="card-description">${product.description}</div>
                        <div class="card-seller">Seller: ${product.sellerEmail}</div>
                        ${!isSeller ? `
                            <button class="btn btn-primary" style="width:100%; margin-top:8px;">
                                View Product
                            </button>
                        ` : `
                            <p style="color:var(--grey-text); font-size:0.85rem; margin-top:8px;">
                                Sellers cannot purchase products.
                            </p>
                        `}
                    </div>
                </div>
            `).join('');
        }

        function filterProducts() {
            const query = document.getElementById('searchInput')
                .value.toLowerCase().trim();

            if (!query) {
                renderProducts(allProducts);
                return;
            }

            const filtered = allProducts.filter(product =>
                product.name.toLowerCase().includes(query) ||
                product.description.toLowerCase().includes(query)
            );

            renderProducts(filtered);
        }

        function goToProduct(productId) {
            window.location.href = `product-detail.html?id=${productId}`;
        }

        function showMessage(text, type) {
            const box = document.getElementById('message');
            box.textContent = text;
            box.className = `message message-${type}`;
            box.style.display = 'block';
        }
    </script>

</body>
</html>
